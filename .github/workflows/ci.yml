name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel previous runs on the same PR / branch when new commits arrive.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.config }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [Release, Debug]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate bundled metadata
        run: python tools/validate_steam_metadata.py

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Test legacy and current packet layouts
        run: |
          cl /nologo /std:c++20 /EHsc /W4 /WX /Isrc tools/tests/net_packet_test.cpp /Fenet_packet_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\net_packet_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure
        run: cmake -S src -B build -G "Ninja Multi-Config"

      - name: Build ${{ matrix.config }}
        run: cmake --build build --config ${{ matrix.config }}

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenSteamTool-${{ matrix.config }}-pr${{ github.event.pull_request.number || github.run_number }}
          path: build/${{ matrix.config }}/
          retention-days: 7
