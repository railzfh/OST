name: Build and Release
run-name: ${{ inputs.version || github.ref_name }} Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.4.9)"
        required: true
        default: ""

env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release version and bundled metadata
        shell: pwsh
        run: |
          if ($env:RELEASE_VERSION -notmatch '^v?[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw 'Use a semantic version tag such as v1.4.9'
          }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            git show-ref --verify --quiet "refs/tags/$env:RELEASE_VERSION"
            if ($LASTEXITCODE -eq 0) { throw 'Release tag already exists' }
            if ($LASTEXITCODE -ne 1) { throw 'Could not check release tag' }
          } elseif ($env:RELEASE_VERSION -ne $env:GITHUB_REF_NAME) {
            throw 'Release version must match the pushed tag'
          }
          python tools/validate_steam_metadata.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Test legacy and current packet layouts
        run: |
          cl /nologo /std:c++20 /EHsc /W4 /WX /Isrc tools/tests/net_packet_test.cpp /Fenet_packet_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\net_packet_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure
        run: cmake -S src -B build -G "Ninja Multi-Config" "-DOPENSTEAMTOOL_VERSION=$env:RELEASE_VERSION"

      - name: Build Release
        run: cmake --build build --config Release

      - name: Build Debug
        run: cmake --build build --config Debug

      - name: Stage Release package
        shell: pwsh
        run: |
          $package = "package-release"
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          foreach ($name in @("OpenSteamTool.dll", "dwmapi.dll", "xinput1_4.dll")) {
            Copy-Item -LiteralPath (Join-Path "build/Release" $name) -Destination (Join-Path $package $name) -Force
          }
          Copy-Item -LiteralPath "build/Release/opensteamtool" -Destination (Join-Path $package "opensteamtool") -Recurse -Force
          $forbidden = Get-ChildItem -Path $package -Recurse -File | Where-Object {
            $_.Extension -in @(".pdb", ".ilk", ".exp", ".lib") -or $_.Name -eq "lua_static.lib"
          }
          if ($forbidden) { throw "Release package contains debug files: $($forbidden.FullName -join ', ')" }
          python tools/validate_steam_metadata.py --root "$package/opensteamtool"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage Debug package
        shell: pwsh
        run: |
          $package = "package-debug"
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item -Path "build/Debug/*" -Destination $package -Recurse -Force
          if (-not (Test-Path -LiteralPath "$package/OpenSteamTool.pdb")) {
            throw 'Debug package is missing OpenSteamTool.pdb'
          }
          python tools/validate_steam_metadata.py --root "$package/opensteamtool"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: OpenSteamTool-${{ env.RELEASE_VERSION }}-packages
          path: |
            package-release/
            package-debug/

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          {
            echo 'changelog<<EOF'
            git log -1 --pretty=format:"- %s%n%b"
            echo ''
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Package artifacts
        shell: pwsh
        run: |
          7z a "OpenSteamTool-$env:RELEASE_VERSION-Release.zip" ".\package-release\*" -mx=5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          7z a "OpenSteamTool-$env:RELEASE_VERSION-Debug.zip" ".\package-debug\*" -mx=5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git tag "$env:RELEASE_VERSION" "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin "refs/tags/$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish formal GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: ${{ env.RELEASE_VERSION }}
          prerelease: false
          make_latest: true
          body: |
            ## Changes

            ${{ steps.changelog.outputs.changelog }}

            ## Installation

            Close Steam before installing. Download the `-Release.zip` asset for normal use. It contains every required runtime file: `OpenSteamTool.dll`, `dwmapi.dll`, `xinput1_4.dll`, and the complete `opensteamtool` compatibility directory.

            Extract the Release archive directly into the Steam root directory (for example `D:\software\steam`), merging folders. Existing configuration and user Lua files are not included and remain untouched.

            The `-Debug.zip` asset contains the same installable files plus PDB/ILK/EXP/LIB development files and a logging-enabled DLL. Use it only for diagnostics.

            This build targets Steam Build `1792618285` and the exact DLL hashes documented in [compatibility/README.md](https://github.com/railzfh/OST/blob/${{ github.sha }}/compatibility/README.md). A later Steam update requires matching metadata.

            Keep your Lua game configs in `<Steam>/config/lua` (not `config/stplug-in`).
          files: |
            OpenSteamTool-${{ env.RELEASE_VERSION }}-Release.zip
            OpenSteamTool-${{ env.RELEASE_VERSION }}-Debug.zip
